<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Curated Design Team for Volvo Cars — Accenture Song</title>
<style>
  :root { --bg:#0a0a0a; --max:1400px; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body {
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:#fff;
  }

  /* Slide deck */
  .deck { max-width:var(--max); margin:0 auto; padding:24px 16px 80px; }
  .slide {
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    margin:0 0 20px;
    border-radius:10px;
    overflow:hidden;
    background:#000;
    box-shadow:0 8px 30px rgba(0,0,0,.45);
    scroll-margin-top:16px;
  }
  .slide img, .slide video {
    width:100%; height:100%;
    display:block; object-fit:cover;
  }
  .slide .num {
    position:absolute; top:12px; right:14px;
    font-size:12px; letter-spacing:.04em;
    background:rgba(0,0,0,.45); color:#fff;
    padding:4px 9px; border-radius:20px;
    opacity:0; transition:opacity .25s;
    backdrop-filter:blur(4px); pointer-events:none;
  }
  .slide:hover .num { opacity:1; }

  /* Lazy fade-in */
  .slide { opacity:0; transform:translateY(14px); transition:opacity .5s ease, transform .5s ease; }
  .slide.in { opacity:1; transform:none; }

  /* Top progress bar */
  .progress {
    position:fixed; top:0; left:0; height:3px; width:0%;
    background:#e0684f; z-index:50; transition:width .1s linear;
  }
  /* Slide counter */
  .counter {
    position:fixed; bottom:18px; right:20px; z-index:50;
    font-size:13px; letter-spacing:.05em;
    background:rgba(20,20,20,.8); color:#fff;
    padding:7px 13px; border-radius:20px;
    backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.1);
  }
  @media (max-width:640px){ .deck{padding:12px 8px 60px;} .slide{margin-bottom:12px;border-radius:6px;} }
</style>
</head>
<body>
<div class="progress" id="progress"></div>
<div class="counter" id="counter">1 / 64</div>
<main class="deck" id="deck"></main>

<script>
// Slide manifest. Static slides use the PNG; verified-motion slides use an MP4 (with the PNG as poster).
const TOTAL = 64;
// All slides with video content (exported from Figma).
const VIDEO_SLIDES = new Set([5, 8, 12, 13, 14, 16, 17, 18, 19, 20, 22, 23, 24, 25, 27, 31, 32, 38, 41, 43, 45, 61, 62]);
const slides = [];
for (let i = 1; i <= TOTAL; i++) {
  const n = String(i).padStart(2, '0');
  if (VIDEO_SLIDES.has(i)) {
    slides.push({ video: `videos/slide-${n}.mp4`, poster: `slides/slide-${n}.png` });
  } else {
    slides.push({ img: `slides/slide-${n}.png` });
  }
}

const deck = document.getElementById('deck');
slides.forEach((s, idx) => {
  const sec = document.createElement('section');
  sec.className = 'slide';
  sec.id = 'slide-' + (idx + 1);
  if (s.video) {
    sec.innerHTML = `<video ${s.poster ? `poster="${s.poster}"` : ''} muted loop playsinline preload="none" data-src="${s.video}"></video>`;
    sec.dataset.video = '1';
  } else {
    sec.innerHTML = `<img src="${s.img}" alt="Slide ${idx + 1}" loading="lazy">`;
  }
  const num = document.createElement('span');
  num.className = 'num';
  num.textContent = (idx + 1) + ' / ' + TOTAL;
  sec.appendChild(num);
  deck.appendChild(sec);
});

// Fade-in on scroll
const io = new IntersectionObserver((entries) => {
  entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
}, { rootMargin: '0px 0px -8% 0px' });
document.querySelectorAll('.slide').forEach(el => io.observe(el));

// Play videos only while visible; pause + free them when off-screen.
const vio = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    const v = e.target.querySelector('video');
    if (!v) return;
    if (e.isIntersecting) {
      if (!v.src) v.src = v.dataset.src;   // lazy-load on first view
      v.play().catch(() => {});
    } else {
      v.pause();
    }
  });
}, { rootMargin: '200px 0px 200px 0px', threshold: 0.25 });
document.querySelectorAll('.slide[data-video]').forEach(el => vio.observe(el));

// Progress bar + counter
const progress = document.getElementById('progress');
const counter = document.getElementById('counter');
const secs = [...document.querySelectorAll('.slide')];
function onScroll() {
  const h = document.documentElement.scrollHeight - window.innerHeight;
  progress.style.width = (window.scrollY / h * 100) + '%';
  const mid = window.scrollY + window.innerHeight / 2;
  let cur = 1;
  for (let i = 0; i < secs.length; i++) {
    if (secs[i].offsetTop <= mid) cur = i + 1;
  }
  counter.textContent = cur + ' / ' + TOTAL;
}
window.addEventListener('scroll', onScroll, { passive: true });
window.addEventListener('resize', onScroll);
onScroll();
</script>
</body>
</html>
