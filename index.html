<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Curated Design Team for Volvo Cars — Accenture Song</title>
<style>
  :root { --bg:#0a0a0a; --max:1400px; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body {
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:#fff;
  }

  /* Slide deck */
  .deck { max-width:var(--max); margin:0 auto; padding:24px 16px 80px; }
  .slide {
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    margin:0 0 20px;
    border-radius:10px;
    overflow:hidden;
    background:#000;
    box-shadow:0 8px 30px rgba(0,0,0,.45);
    scroll-margin-top:16px;
  }
  .slide img, .slide video {
    width:100%; height:100%;
    display:block; object-fit:cover;
  }
  .slide .num {
    position:absolute; top:12px; right:14px;
    font-size:12px; letter-spacing:.04em;
    background:rgba(0,0,0,.45); color:#fff;
    padding:4px 9px; border-radius:20px;
    opacity:0; transition:opacity .25s;
    backdrop-filter:blur(4px); pointer-events:none;
  }
  .slide:hover .num { opacity:1; }

  /* Lazy fade-in */
  .slide { opacity:0; transform:translateY(14px); transition:opacity .5s ease, transform .5s ease; }
  .slide.in { opacity:1; transform:none; }

  /* Top progress bar */
  .progress {
    position:fixed; top:0; left:0; height:3px; width:0%;
    background:#e0684f; z-index:50; transition:width .1s linear;
  }
  /* Slide counter */
  .counter {
    position:fixed; bottom:18px; right:20px; z-index:50;
    font-size:13px; letter-spacing:.05em;
    background:rgba(20,20,20,.8); color:#fff;
    padding:7px 13px; border-radius:20px;
    backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.1);
  }
  @media (max-width:640px){ .deck{padding:12px 8px 60px;} .slide{margin-bottom:12px;border-radius:6px;} }

  /* Password gate */
  #gate {
    position:fixed; inset:0; z-index:999;
    background:#0a0a0a;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:24px;
  }
  #gate .logo {
    font-size:13px; letter-spacing:.12em; text-transform:uppercase;
    color:rgba(255,255,255,.35); font-weight:500;
  }
  #gate h1 {
    font-size:clamp(20px,3vw,32px); font-weight:600;
    letter-spacing:-.02em; color:#fff; text-align:center;
    max-width:400px; line-height:1.25;
  }
  #gate form {
    display:flex; flex-direction:column; align-items:center; gap:12px;
    width:100%; max-width:320px;
  }
  #gate input {
    width:100%; padding:14px 18px; border-radius:10px;
    background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.12);
    color:#fff; font-size:16px; letter-spacing:.05em; text-align:center;
    outline:none; transition:border-color .2s;
  }
  #gate input:focus { border-color:rgba(255,255,255,.35); }
  #gate input::placeholder { color:rgba(255,255,255,.3); letter-spacing:.05em; }
  #gate button {
    width:100%; padding:14px; border-radius:10px; border:none;
    background:#fff; color:#0a0a0a; font-size:15px; font-weight:600;
    cursor:pointer; letter-spacing:-.01em; transition:opacity .2s;
  }
  #gate button:hover { opacity:.88; }
  #gate .err {
    font-size:13px; color:#e0684f; height:16px; text-align:center;
  }
  #gate.hidden { display:none; }
</style>
</head>
<body>

<!-- Password gate -->
<div id="gate">
  <span class="logo">Accenture Song</span>
  <h1>A Curated Design Team<br>for Volvo Cars</h1>
  <form id="gate-form">
    <input id="pw" type="password" placeholder="Enter password" autocomplete="current-password" autofocus>
    <button type="submit">Enter</button>
    <span class="err" id="err"></span>
  </form>
</div>

<div class="progress" id="progress"></div>
<div class="counter" id="counter">1 / 89</div>
<main class="deck" id="deck"></main>

<script>
// Password gate
(function() {
  const PASS = 'song2026';
  const gate = document.getElementById('gate');
  const form = document.getElementById('gate-form');
  const err  = document.getElementById('err');

  if (sessionStorage.getItem('auth') === '1') { gate.classList.add('hidden'); return; }

  form.addEventListener('submit', e => {
    e.preventDefault();
    if (document.getElementById('pw').value === PASS) {
      sessionStorage.setItem('auth', '1');
      gate.classList.add('hidden');
    } else {
      err.textContent = 'Incorrect password. Try again.';
      document.getElementById('pw').value = '';
      document.getElementById('pw').focus();
    }
  });
})();

// Slide manifest. Static slides use the PNG; verified-motion slides use an MP4 (with the PNG as poster).
const TOTAL = 89;
// All slides with video content (exported from Figma).
// Note: old slides 61+62 (videos) shifted to positions 69+70 after inserting 8 new slides at 56-63.
const VIDEO_SLIDES = new Set([5, 8, 12, 13, 14, 16, 17, 18, 19, 20, 22, 23, 24, 25, 27, 31, 32, 38, 41, 43, 45, 69, 70]);
const slides = [];
for (let i = 1; i <= TOTAL; i++) {
  const n = String(i).padStart(2, '0');
  if (VIDEO_SLIDES.has(i)) {
    slides.push({ video: `videos/slide-${n}.mp4`, poster: `slides/slide-${n}.png` });
  } else {
    slides.push({ img: `slides/slide-${n}.png` });
  }
}

const deck = document.getElementById('deck');
slides.forEach((s, idx) => {
  const sec = document.createElement('section');
  sec.className = 'slide';
  sec.id = 'slide-' + (idx + 1);
  if (s.video) {
    sec.innerHTML = `<video ${s.poster ? `poster="${s.poster}"` : ''} muted loop playsinline preload="none" data-src="${s.video}"></video>`;
    sec.dataset.video = '1';
  } else {
    sec.innerHTML = `<img src="${s.img}" alt="Slide ${idx + 1}" loading="lazy">`;
  }
  const num = document.createElement('span');
  num.className = 'num';
  num.textContent = (idx + 1) + ' / ' + TOTAL;
  sec.appendChild(num);
  deck.appendChild(sec);
});

// Fade-in on scroll
const io = new IntersectionObserver((entries) => {
  entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
}, { rootMargin: '0px 0px -8% 0px' });
document.querySelectorAll('.slide').forEach(el => io.observe(el));

// Play videos only while visible; pause + free them when off-screen.
const vio = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    const v = e.target.querySelector('video');
    if (!v) return;
    if (e.isIntersecting) {
      if (!v.src) v.src = v.dataset.src;   // lazy-load on first view
      v.play().catch(() => {});
    } else {
      v.pause();
    }
  });
}, { rootMargin: '200px 0px 200px 0px', threshold: 0.25 });
document.querySelectorAll('.slide[data-video]').forEach(el => vio.observe(el));

// Progress bar + counter
const progress = document.getElementById('progress');
const counter = document.getElementById('counter');
const secs = [...document.querySelectorAll('.slide')];
function onScroll() {
  const h = document.documentElement.scrollHeight - window.innerHeight;
  progress.style.width = (window.scrollY / h * 100) + '%';
  const mid = window.scrollY + window.innerHeight / 2;
  let cur = 1;
  for (let i = 0; i < secs.length; i++) {
    if (secs[i].offsetTop <= mid) cur = i + 1;
  }
  counter.textContent = cur + ' / ' + TOTAL;
}
window.addEventListener('scroll', onScroll, { passive: true });
window.addEventListener('resize', onScroll);
onScroll();
</script>
</body>
</html>
